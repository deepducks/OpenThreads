version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: openthreads-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: openthreads
      MONGO_INITDB_ROOT_PASSWORD: openthreads
      MONGO_INITDB_DATABASE: openthreads
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local

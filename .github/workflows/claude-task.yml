# =============================================================================
# Claude Task Worker
# =============================================================================
#
# PURPOSE
# -------
# Implements a single issue from the implementation plan. Triggered when the
# Meta Orchestrator (or a human) comments `@claude` on a task issue. Reads
# the issue body as its specification, writes code, creates a PR, and merges.
#
# HOW IT WORKS
# ------------
# 1. Triggered by an `@claude` comment on a non-meta issue.
#    (Excludes `@claude fix` — that's handled by the Fix Agent.)
# 2. Extracts the base branch from the comment (e.g., `meta/17`).
#    The meta orchestrator always includes `Base branch: \`meta/<N>\`` in
#    its trigger comment. Falls back to `main` if not found.
# 3. Checks out the base branch (NOT `main`) — this is critical to avoid
#    merge conflicts. Earlier iterations checked out `main`, causing every
#    PR to conflict with the meta branch.
# 4. Runs the Claude agent in interactive mode (no `prompt` input).
#    The agent reads the issue body (tasks, acceptance criteria) and the
#    triggering comment (base branch instructions) as context.
# 5. After the agent finishes, a post-step automatically:
#    a. Finds the branch the agent pushed
#    b. Creates a PR targeting the meta branch
#    c. Merges the PR (with conflict resolution if needed)
#
# BRANCH MODEL
# ------------
# The `branch_prefix` is set dynamically to `claude/<meta_number>-` so that
# task branches are namespaced under their meta issue:
#   meta/17 → claude/17-issue-4-20260410-2205
#
# This was added because early iterations used the default `claude/` prefix,
# making it hard to associate branches with their meta issue.
#
# WHY DYNAMIC `base_branch`
# -------------------------
# The action's `base_branch` input controls two things:
# 1. Which branch to diff against (determines what's "new")
# 2. Which branch PRs target
# By extracting it from the meta orchestrator's comment, we ensure each task
# automatically targets the correct meta branch without hardcoding.
#
# WHY NO `prompt` INPUT
# ---------------------
# Without `prompt`, the action runs in "interactive mode" — it reads the
# issue body and triggering comment as context. This is correct because:
# - The issue body contains the full spec (tasks, acceptance criteria)
# - The comment contains branch instructions from the orchestrator
# - The action's built-in system prompt provides GitHub context
# Adding a `prompt` would switch to automation mode and lose the issue context.
#
# AUTO PR + MERGE (post-step)
# ---------------------------
# The `claude-code-action` in interactive mode does NOT create PRs — it pushes
# a branch and posts a "Create PR" link. We added a post-step that:
# 1. Finds the branch by matching `claude/*issue-<N>*`
# 2. Creates a PR with `fixes #<N>` in the body
# 3. Tries a direct merge; if conflicts exist, rebases onto the base branch
# 4. If rebase fails, falls back to `merge -X theirs`
# This makes the entire flow autonomous — no human needs to create PRs.
#
# CONFLICT RESOLUTION STRATEGY
# ----------------------------
# Conflicts can happen when multiple tasks in the same wave modify shared
# files (e.g., package.json, index.ts). Resolution order:
# 1. Direct merge (no conflicts) → done
# 2. Rebase onto base branch → push with --force-with-lease → merge
# 3. Merge with -X theirs (accept base branch for conflicting hunks) → push
# The `-X theirs` fallback prefers the base branch's version in conflicts,
# which may lose some task changes — but it keeps the loop moving. The fix
# agent can clean up if needed.
#
# TIMEOUT
# -------
# 60-minute hard limit. Complex issues (e.g., full adapter implementations)
# can take 10-15 minutes. The timeout prevents runaway costs if the agent
# gets stuck in a loop.
#
# FAILURE HANDLING
# ----------------
# On failure, two notifications are posted:
# 1. On the meta issue: "Task #X failed" with run link and retry instructions
# 2. On the task issue itself: failure notice + `@claude fix` instructions
# This allows both the orchestrator and humans to see what broke.
#
# `allowed_bots`
# --------------
# Set to `claude[bot]` because the Meta Orchestrator (which runs as
# `claude[bot]`) is the one commenting `@claude` on task issues. Without
# this, the action rejects bot-initiated triggers.
# =============================================================================

name: Claude Task Worker

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  issue_comment:
    types: [created]

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Trigger on @claude comments on non-meta issues.
    # Excludes @claude fix (handled by claude-fix.yml).
    if: >
      contains(github.event.comment.body, '@claude')
      && !contains(toJSON(github.event.issue.labels.*.name), 'meta')
      && !contains(github.event.comment.body, '@claude fix')

    steps:
      # --- Extract base branch from the orchestrator's comment ---
      # The meta orchestrator always includes: Base branch: `meta/<N>`
      # We parse this to dynamically configure checkout and PR target.
      - name: Extract meta context from comment
        id: meta
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          BASE_BRANCH=$(echo "$COMMENT_BODY" | grep -oP 'Base branch: `\K[^`]+' || echo "main")
          META_NUM=$(echo "$BASE_BRANCH" | grep -oP '\d+' || echo "0")
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "meta_number=$META_NUM" >> "$GITHUB_OUTPUT"

      # --- Checkout the meta branch, NOT main ---
      # This eliminates the root cause of merge conflicts. Early iterations
      # checked out main, so every task branch diverged from meta/<N>.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.base_branch }}
          fetch-depth: 0

      # --- Run the Claude agent ---
      # Interactive mode: reads issue body + comment as context.
      - name: Run Claude Task Worker
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-sonnet-4-6"
          allowed_bots: "claude[bot]"
          base_branch: ${{ steps.meta.outputs.base_branch }}
          branch_prefix: "claude/${{ steps.meta.outputs.meta_number }}-"

      # --- Auto-create PR and merge ---
      # The action pushes a branch but does not create a PR in interactive mode.
      # This step closes the loop by creating the PR and merging it.
      - name: Auto-create PR and merge
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          BASE_BRANCH: ${{ steps.meta.outputs.base_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use gh api instead of git ls-remote (git auth is not available in post-steps)
          BRANCH=$(gh api "repos/${{ github.repository }}/git/matching-refs/heads/claude/" \
            --jq "[.[].ref | select(contains(\"issue-${ISSUE_NUM}-\"))] | sort | last // empty" \
            | sed 's|refs/heads/||' 2>/dev/null || echo "")

          if [ -z "$BRANCH" ]; then
            echo "No branch found for issue #${ISSUE_NUM}, skipping PR creation"
            exit 0
          fi

          echo "Found branch: $BRANCH"

          # Check if PR already exists
          EXISTING=$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --json number --jq 'length' 2>/dev/null || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            echo "PR already exists for $BRANCH"
            exit 0
          fi

          # Create PR
          TITLE=$(gh issue view "$ISSUE_NUM" --json title --jq '.title')
          PR_URL=$(gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --title "$TITLE" --body "fixes #${ISSUE_NUM}")
          PR_NUM=$(echo "$PR_URL" | grep -oP '\d+$')
          echo "Created PR #$PR_NUM"

          # Try to merge directly
          if gh pr merge "$PR_NUM" --merge 2>/dev/null; then
            echo "PR #$PR_NUM merged successfully"
            exit 0
          fi

          echo "Direct merge failed, attempting merge via API..."

          # Use gh API to attempt merge (avoids git auth issues)
          gh api "repos/${{ github.repository }}/pulls/${PR_NUM}/merge" \
            -X PUT -f merge_method=merge 2>/dev/null && {
            echo "PR #$PR_NUM merged via API"
            exit 0
          }

          echo "API merge also failed — PR may need manual conflict resolution"
          exit 1

      # --- Notify meta issue to continue the loop ---
      # CRITICAL: PR merges done by GITHUB_TOKEN do NOT trigger `pull_request: closed`
      # events (GitHub Actions limitation to prevent infinite loops). Without this step,
      # the meta orchestrator would never learn that a task was merged. By commenting
      # `@claude` on the meta issue, we trigger the meta workflow via `issue_comment`,
      # which reads the current state and advances to the next wave.
      - name: Notify meta to continue loop
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          META_NUM: ${{ steps.meta.outputs.meta_number }}
        run: |
          if [ "$META_NUM" != "0" ] && [ -n "$META_NUM" ]; then
            gh issue comment "$META_NUM" --body "@claude Task #${ISSUE_NUM} merged. Check progress and assign next tasks."
          fi

      # --- Failure notification ---
      # Posts on both the meta issue and the task issue so failures are visible.
      - name: Notify failure on meta issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          META_NUM: ${{ steps.meta.outputs.meta_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          META_ISSUE=$(gh issue list --label meta --json number --jq ".[[] | select(.number == ${META_NUM})] .number" 2>/dev/null || echo "$META_NUM")
          if [ -z "$META_ISSUE" ] || [ "$META_ISSUE" = "0" ]; then
            META_ISSUE=$(gh issue list --label meta --json number --jq '.[0].number' 2>/dev/null || echo "")
          fi

          if [ -n "$META_ISSUE" ]; then
            gh issue comment "$META_ISSUE" --body "$(cat <<EOF
          ⚠️ **Task Worker Failed** — Issue #${ISSUE_NUM}

          - **Run:** https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}
          - **Issue:** #${ISSUE_NUM}
          - **Action needed:** Comment \`@claude fix\` on issue #${ISSUE_NUM} to retry with error context.
          EOF
          )"
          fi

          gh issue comment "$ISSUE_NUM" --body "$(cat <<EOF
          ⚠️ **Task worker failed.** [View logs](https://github.com/${{ github.repository }}/actions/runs/${RUN_ID})

          To retry with fix context, comment \`@claude fix\` on this issue.
          EOF
          )"

name: Claude Task Worker

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  issue_comment:
    types: [created]

jobs:
  execute:
    runs-on: ubuntu-latest
    if: >
      contains(github.event.comment.body, '@claude')
      && !contains(toJSON(github.event.issue.labels.*.name), 'meta')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Claude Task Worker
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-sonnet"
